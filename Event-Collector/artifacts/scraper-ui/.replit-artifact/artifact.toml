kind = "web"
previewPath = "/"
title = "Concert Scraper UI"
version = "1.0.0"
id = "artifacts/scraper-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22742

[services.development]
run = "pnpm --filter @workspace/scraper-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scraper-ui", "run", "build" ]
publicDir = "artifacts/scraper-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22742"
BASE_PATH = "/"

[[services]]
name = "scraper-api"
paths = [ "/scraper-api" ]
localPort = 8082

[services.development]
run = "python3 /home/runner/workspace/scraper/web_api.py"

[services.env]
SCRAPER_API_PORT = "8082"
